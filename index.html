<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Burguers</title>

<style>
body {margin:0;font-family:Arial;background:#0f0f0f;color:#fff;}
header {background:#ff0000;padding:15px;text-align:center;font-size:22px;font-weight:bold;}
.container {padding:15px;}
.card {background:#1c1c1c;border-radius:12px;padding:12px;margin-bottom:15px;}
button {background:#ff0000;color:#fff;border:none;padding:10px;width:100%;border-radius:6px;margin-top:10px;}
.totalBox {position:fixed;bottom:0;width:100%;background:#111;padding:10px;border-top:2px solid red;}
.status {text-align:center;margin-top:10px;font-weight:bold;}
.pixBox {background:#1c1c1c;padding:10px;border-radius:10px;margin-top:10px;text-align:center;}
</style>
</head>

<body>

<header>🍔 Fast Burguers</header>

<div class="container">

<div class="card">
<h3>X-Burguer</h3>
<p>R$ 18,90</p>
<button onclick="add(18.9,'X-Burguer')">Adicionar</button>
</div>

<div class="card">
<h3>X-Bacon</h3>
<p>R$ 23,90</p>
<button onclick="add(23.9,'X-Bacon')">Adicionar</button>
</div>

</div>

<div class="pixBox">
<p>💰 Pagamento via PIX</p>
<p id="pix">589a5b52-c86a-4df2-9fde-1fd86498695f</p>
<button onclick="copiarPix()">Copiar chave PIX</button>
</div>

<div class="status" id="status">🟡 Aguardando pedido...</div>

<div class="totalBox">
<div>Subtotal: R$ <span id="subtotal">0</span></div>
<div>Entrega: R$ 5,00</div>
<div><strong>Total: R$ <span id="total">0</span></strong></div>
<button onclick="finalizar()">Finalizar Pedido</button>
</div>

<script>
let subtotal = 0;
let pedidos = [];

function add(valor, nome){
    subtotal += valor;
    pedidos.push(nome);
    atualizar();
}

function atualizar(){
    document.getElementById('subtotal').innerText = subtotal.toFixed(2);
    document.getElementById('total').innerText = (subtotal + 5).toFixed(2);
}

function copiarPix(){
    navigator.clipboard.writeText("589a5b52-c86a-4df2-9fde-1fd86498695f");
    alert("Chave PIX copiada!");
}

function finalizar(){
    let total = subtotal + 5;

    document.getElementById("status").innerText = "🟡 Aguardando pagamento...";

    setTimeout(()=> {
        document.getElementById("status").innerText = "🍔 Pedido em preparo...";
    }, 5000);

    setTimeout(()=> {
        document.getElementById("status").innerText = "🚚 Saiu para entrega!";
    }, 10000);

    let msg = "Pedido:%0A";
    pedidos.forEach(p => msg += "- " + p + "%0A");
    msg += "%0ATotal: R$ " + total.toFixed(2);

    window.open("https://wa.me/5547996575888?text=" + msg);
}
</script>

</body>
</html>
